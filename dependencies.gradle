repositories {
	mavenLocal()
	mavenCentral()
	maven {
		name "Modmaven"
		url "https://modmaven.dev"
		content {
			// GrandPower
			includeGroup "dev.technici4n"
			// Modern Industrialization
			includeGroup "aztech"
			// Tesseract
			includeGroup "net.swedz"
		}
	}
	maven {
		name = "shedaniel"
		url "https://maven.shedaniel.me"
		content {
			// Cloth Config
			includeGroup "me.shedaniel.cloth"
			// Architectury
			includeGroup "dev.architectury"
		}
	}
	maven {
		name = "Gnomecraft"
		url = "https://maven.gnomecraft.net/repository/maven-public"
		content {
			// EMI
			includeGroup "dev.emi"
		}
	}
	maven {
		url = "https://maven.latvian.dev/releases"
		content {
			// KubeJS & Rhino
			includeGroup "dev.latvian.apps"
			includeGroup "dev.latvian.mods"
		}
	}
	maven {
		url = "https://jitpack.io"
		content {
			// KubeJS
			includeGroup "com.github.rtyley"
		}
	}
}

dependencies {
	implementation "aztech:Modern-Industrialization:${modern_industrialization_version}"

	implementation "dev.technici4n:GrandPower:${grandpower_version}"

	if (project.runtime_include_emi.toBoolean()) {
		localImplementation "dev.emi:emi-neoforge:${emi_version}"
	} else {
		compileOnly "dev.emi:emi-neoforge:${emi_version}"
	}

	implementation "net.swedz:tesseract-api-neoforge:${tesseract_version}"

	if (project.runtime_include_kjs.toBoolean()) {
		localImplementation "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
	} else {
		compileOnly "dev.latvian.mods:kubejs-neoforge:${kubejs_version}"
	}
}